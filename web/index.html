async function loadUsage() {
  try {
    // Refresh the provider/alias filter options from the live instance config,
    // preserving the current selection across view switches.
    const inst = await api("/api/instances");
    const provSel = $("u-provider"), aliasSel = $("u-alias");
    if (provSel && aliasSel) {
      const curP = provSel.value, curA = aliasSel.value;
      provSel.innerHTML = `<option value="">all providers</option>` + [...new Set(inst.instances.map(x => x.template))].sort()
        .map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join("");
      aliasSel.innerHTML = `<option value="">all aliases</option>` + inst.instances.map(x => x.alias).sort()
        .map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("");
      provSel.value = curP; aliasSel.value = curA;
    }
    await searchUsage();
  } catch (e) { alert(e.message); }
}
async function searchUsage() {
  const params = new URLSearchParams();
  params.set("granularity", $("u-gran").value);
  if ($("u-provider").value) params.set("provider", $("u-provider").value);
  if ($("u-alias").value) params.set("alias", $("u-alias").value);
  if ($("u-model").value.trim()) params.set("model", $("u-model").value.trim());
  if ($("u-group").value) params.set("group", $("u-group").value);
  if ($("u-since").value) params.set("since", $("u-since").value + "T00:00:00Z");
  if ($("u-until").value) params.set("until", $("u-until").value + "T23:59:59Z");
  const el = $("usage-result");
  el.innerHTML = `<span class="muted">Loading…</span>`;
  let data;
  try { data = await api("/api/usage?" + params.toString()); }
  catch (e) { el.innerHTML = `<span class="muted">${esc(e.message)}</span>`; return; }
  const t = data.totals;
  if (!t || !t.request_count) { el.innerHTML = `<span class="muted">No usage in range.</span>`; return; }
  const fmt = (v) => "$" + (v || 0).toFixed(4);
  const unpricedNote = t.unpriced_requests
    ? ` <span class="badge warn" title="Requests whose model is not in the gateway's price table are counted at $0">${t.unpriced_requests} unpriced</span>` : "";
  // Stacked column chart of how the total changes over time, always rendered;
  // segmented by the selected breakdown (model/provider) when one is set, and
  // toggled between cost and tokens without refetching.
  lastUsageData = data;
  const chart = `<div id="usage-chart" style="margin-top:4px;margin-bottom:16px">${renderUsageChart(data)}</div>`;
  el.innerHTML = `
    <div class="row" style="align-items:center; margin-bottom:12px">
      <strong style="font-size:15px">${fmt(t.cost_total)} total</strong>
      <span class="muted">${t.request_count} requests · ${t.prompt_tokens.toLocaleString()} in / ${t.completion_tokens.toLocaleString()} out / ${t.cached_tokens.toLocaleString()} cached</span>
      ${unpricedNote}
    </div>
    ${renderCostDonut(t, fmt)}
    ${chart}
    <table>
      <thead><tr><th>Period</th><th>Requests</th><th>Prompt tok</th><th>Completion tok</th><th>Cached tok</th><th>Input $</th><th>Output $</th><th>Cache $</th><th>Total $</th><th></th></tr></thead>
      <tbody>
        ${data.buckets.map(b => `<tr>
          <td>${esc(b.period)}</td>
          <td>${b.request_count}</td>
          <td>${b.prompt_tokens.toLocaleString()}</td>
          <td>${b.completion_tokens.toLocaleString()}</td>
          <td>${b.cached_tokens.toLocaleString()}</td>
          <td>${fmt(b.cost_input)}</td>
          <td>${fmt(b.cost_output)}</td>
          <td>${fmt((b.cost_cache_read || 0) + (b.cost_cache_write || 0))}</td>
          <td><strong>${fmt(b.cost_total)}</strong></td>
          <td>${b.unpriced_requests ? `<span class="badge warn" title="Requests whose model is not in the price table">${b.unpriced_requests} unpriced</span>` : ""}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
}
// costSplitPalette maps the four cost components to fixed donut colors.
const costSplitPalette = { input: "#4f8cff", cacheRead: "#f1c40f", cacheWrite: "#e67e22", output: "#2ecc71" };

// renderCostDonut renders the input/output/cache cost split as a conic-gradient
// donut (pure CSS, hole carries the total) beside a legend of amounts and
// percentage shares. Skips the ring when nothing is priced (total <= 0) and
// keeps zero rows in the legend so all four components stay visible.
function renderCostDonut(t, fmt) {
  const parts = [
    { key: "input", label: "Input", v: t.cost_input || 0 },
    { key: "cacheRead", label: "Cached input", v: t.cost_cache_read || 0 },
    { key: "cacheWrite", label: "Cache write", v: t.cost_cache_write || 0 },
    { key: "output", label: "Output", v: t.cost_output || 0 },
  ];
  const total = parts.reduce((s, p) => s + p.v, 0);
  let acc = 0;
  const stops = parts.filter(p => p.v > 0).map(p => {
    const start = acc; acc += 360 * p.v / total;
    return `${costSplitPalette[p.key]} ${start.toFixed(3)}deg ${acc.toFixed(3)}deg`;
  });
  const donut = total > 0 ? `
      <div style="position:relative;width:128px;height:128px;flex-shrink:0" title="Total ${esc(fmt(total))}">
        <div style="width:100%;height:100%;border-radius:50%;background:conic-gradient(${stops.join(",")})"></div>
        <div style="position:absolute;inset:26px;border-radius:50%;background:var(--panel);display:grid;place-items:center">
          <span style="font-weight:600;font-size:13px">${esc(fmt(total))}</span>
        </div>
      </div>` : "";
  const legend = parts.map(p => {
    const pct = total > 0 ? (100 * p.v / total).toFixed(1) + "%" : "—";
    return `<div style="display:flex;align-items:baseline;gap:8px">
        <span style="width:10px;height:10px;border-radius:2px;background:${costSplitPalette[p.key]};align-self:center;flex-shrink:0"></span>
        <span class="usage-label">${esc(p.label)}</span>
        <span class="usage-value" style="margin-left:auto">${esc(fmt(p.v))}</span>
        <span class="muted" style="width:46px;text-align:right">${pct}</span>
      </div>`;
  }).join("");
  return `<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      ${donut}
      <div style="display:flex;flex-direction:column;gap:5px;min-width:250px">${legend}</div>
    </div>`;
}

// tokenChartPalette is the fixed series palette for the usage charts, cycled
// when there are more series than colors.
const tokenChartPalette = ["#4f8cff", "#2ecc71", "#f1c40f", "#e74c3c", "#9b59b6", "#e67e22", "#1abc9c", "#e84393", "#a29bfe", "#00b894", "#fd79a8", "#6c5ce7"];

// usageChartMetric is the stacked column chart's unit ("cost" or "tokens"),
// kept across searches; lastUsageData caches the most recent /api/usage
// response so the Cost/Tokens toggle re-renders the chart without refetching.
let usageChartMetric = "cost";
let lastUsageData = null;

// setChartMetric flips the chart unit and re-renders it from cached data.
function setChartMetric(m) {
  usageChartMetric = m === "tokens" ? "tokens" : "cost";
  const wrap = $("usage-chart");
  if (wrap && lastUsageData) wrap.innerHTML = renderUsageChart(lastUsageData);
}

// renderUsageChart draws a vertical stacked column chart: one column per
// period (oldest to newest), stacked bottom-up per group (resolved model or
// provider) when a breakdown is selected, in the unit picked by the
// Cost/Tokens toggle. Pure CSS/DOM — no chart library. Missing days are
// rendered as empty columns (capped) so the time axis stays honest; x labels
// thin out on long ranges and the plot scrolls horizontally.
function renderUsageChart(data) {
  const buckets = data.buckets || [];
  const metric = usageChartMetric;
  const valOf = (b) => metric === "cost" ? (b.cost_total || 0) : ((b.prompt_tokens || 0) + (b.completion_tokens || 0));
  const grouped = !!(data.group && buckets.length && buckets[0].group);
  const byGroup = new Map();   // group -> Map(period -> bucket)
  buckets.forEach(b => {
    const g = grouped ? (b.group || "(unknown)") : "all";
    if (!byGroup.has(g)) byGroup.set(g, new Map());
    byGroup.get(g).set(b.period, b);
  });
  const totalOf = (g) => [...byGroup.get(g).values()].reduce((s, b) => s + valOf(b), 0);
  const series = [...byGroup.keys()].sort((a, b) => totalOf(b) - totalOf(a));
  const colorOf = {};
  series.forEach((g, i) => { colorOf[g] = tokenChartPalette[i % tokenChartPalette.length]; });
  let periods = [...new Set(buckets.map(b => b.period))].sort();
  if (data.granularity === "day" && periods.length > 1) {
    const start = new Date(periods[0] + "T00:00:00Z"), end = new Date(periods[periods.length - 1] + "T00:00:00Z");
    if ((end - start) / 864e5 <= 183) {
      const filled = [];
      for (let d = start; d <= end; d.setUTCDate(d.getUTCDate() + 1)) filled.push(d.toISOString().slice(0, 10));
      periods = filled;
    }
  }
  const grand = series.reduce((s, g) => s + totalOf(g), 0);
  if (grand <= 0) {
    return `<div class="muted" style="padding:20px 0">No ${esc(metric)} in range${metric === "cost" ? " — every request is unpriced; try the Tokens view" : ""}.</div>`;
  }
  const PLOT_H = 190, TOP_PAD = 16;
  const maxV = Math.max(1, ...periods.map(p => series.reduce((s, g) => { const b = byGroup.get(g).get(p); return s + (b ? valOf(b) : 0); }, 0)));
  const compact = (v) => metric === "cost"
    ? "$" + (v >= 100 ? v.toFixed(0) : v >= 1 ? v.toFixed(2) : v.toFixed(3))
    : (v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? (v / 1e3).toFixed(1) + "k" : String(Math.round(v)));
  const showTotals = periods.length <= 24;
  const colW = periods.length > 60 ? 8 : 14;
  const cellW = colW + 2;
  const labelEvery = Math.max(1, Math.ceil(periods.length / 18));
  const xLabel = (p) => data.granularity === "month" ? p : p.slice(5);   // "MM-DD" / "W33"
  const cell = `flex:1 1 0;min-width:${colW}px`;
  const cols = periods.map((p, i) => {
    let segs = "", tot = 0;
    series.forEach(g => {
      const b = byGroup.get(g).get(p);
      const v = b ? valOf(b) : 0;
      if (!v) return;
      tot += v;
      const disp = metric === "cost" ? "$" + v.toFixed(4) : v.toLocaleString() + " tok";
      segs += `<div style="height:${(PLOT_H * v / maxV).toFixed(1)}px;background:${colorOf[g]}" title="${esc(g)} · ${esc(disp)} on ${esc(p)}"></div>`;
    });
    const totLabel = showTotals && tot > 0 ? `<span class="muted" style="font-size:10px;line-height:14px;text-align:center">${compact(tot)}</span>` : "";
    return `<div style="${cell};display:flex;flex-direction:column;justify-content:flex-end;height:${TOP_PAD + PLOT_H}px">${totLabel}${segs}</div>`;
  }).join("");
  const xlabels = periods.map((p, i) =>
    `<div style="${cell};height:18px;line-height:18px;font-size:10px;color:var(--muted);text-align:center">${i % labelEvery === 0 || i === periods.length - 1 ? esc(xLabel(p)) : ""}</div>`).join("");
  const ylabels = [0.25, 0.5, 0.75, 1].map(f =>
    `<span class="muted" style="position:absolute;left:0;right:0;bottom:${(PLOT_H * f - 7).toFixed(0)}px;text-align:right;font-size:10px">${compact(maxV * f)}</span>`).join("") +
    `<span class="muted" style="position:absolute;left:0;right:0;bottom:-3px;text-align:right;font-size:10px">0</span>`;
  const gridlines = [0.25, 0.5, 0.75, 1].map(f =>
    `<div style="position:absolute;left:0;right:0;bottom:${(PLOT_H * f).toFixed(0)}px;border-top:1px dashed var(--border)"></div>`).join("");
  const dim = data.group === "model" ? "resolved model" : "provider";
  const metricBtn = (m, label) =>
    `<button class="ghost" data-action="usage-chart-metric" data-metric="${m}" aria-pressed="${metric === m}" style="padding:2px 10px;font-size:12px;${metric === m ? "color:var(--text);border-color:var(--accent)" : ""}">${label}</button>`;
  const grandTok = series.reduce((s, g) => s + [...byGroup.get(g).values()].reduce((x, b) => x + (b.prompt_tokens || 0) + (b.completion_tokens || 0), 0), 0);
  const legend = grouped ? `<div style="display:flex;flex-wrap:wrap;gap:2px 16px;margin:6px 0 12px">${series.map(g => {
    const tok = [...byGroup.get(g).values()].reduce((x, b) => x + (b.prompt_tokens || 0) + (b.completion_tokens || 0), 0);
    const cost = [...byGroup.get(g).values()].reduce((x, b) => x + (b.cost_total || 0), 0);
    const pct = grandTok ? (100 * tok / grandTok).toFixed(1) : "0";
    return `<span style="display:inline-flex;align-items:center;gap:6px">
      <span style="width:10px;height:10px;border-radius:2px;background:${colorOf[g]};flex-shrink:0"></span>
      <span>${esc(g)}</span>
      <span class="muted">${tok.toLocaleString()} tok (${pct}%) · $${cost.toFixed(4)}</span>
    </span>`;
  }).join("")}</div>` : "";
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span class="muted">${esc(metric === "cost" ? "Cost" : "Tokens")} over time${grouped ? " by " + esc(dim) : ""}</span>
      <span style="display:inline-flex;gap:4px">${metricBtn("cost", "Cost")}${metricBtn("tokens", "Tokens")}</span>
    </div>
    ${legend}
    <div style="display:flex;gap:8px">
      <div style="position:relative;width:48px;height:${TOP_PAD + PLOT_H}px;flex-shrink:0">${ylabels}</div>
      <div style="flex:1;overflow-x:auto">
        <div style="min-width:${periods.length * cellW}px">
          <div style="position:relative;display:flex;gap:2px;align-items:flex-end;height:${TOP_PAD + PLOT_H}px;border-bottom:1px solid var(--border)">${gridlines}${cols}</div>
          <div style="display:flex;gap:2px">${xlabels}</div>
        </div>
      </div>
    </div>`;
}

/* ---------- Master key banner ---------- */
let generatedMasterKey = "";

// On page load, check for an unacknowledged gateway-generated master key. A
// 404 (no generated key, or already acknowledged) means no banner; a 200 shows
// the key once so the user can copy and save it before it is cleared from
// memory by the ACK.
async function loadMasterKeyBanner() {
  let data;
  try {
    data = await api("/api/secrets/master-key");
  } catch { return; }
  if (!data || !data.key) return;
  generatedMasterKey = data.key;
  document.querySelector("main").insertAdjacentHTML("afterbegin", `
    <div class="panel" id="master-key-banner">
      <h2>Master key generated — copy and save it</h2>
      <div class="muted" style="margin-bottom:10px">The secrets file is encrypted with a key generated on this first run. If you lose it, the stored API keys cannot be recovered — there is no recovery path. Copy it now and store it somewhere safe.</div>
      <div class="row">
        <code style="padding:6px 8px; background:var(--bg); border:1px solid var(--border); border-radius:6px;">${esc(generatedMasterKey)}</code>
        <button data-action="copy-master-key">Copy</button>
        <button class="ghost" data-action="ack-master-key" id="ack-master-key" disabled>I've saved it</button>
      </div>
    </div>`);
}

// Copy the generated key to the clipboard via the async Clipboard API, falling
// back to a hidden textarea + execCommand. The ACK button stays disabled until
// a copy actually succeeds (cheap guard against acknowledging an uncopied key).
async function copyMasterKey() {
  if (!generatedMasterKey) return;
  let ok = false;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(generatedMasterKey);
      ok = true;
    } catch {}
  }
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = generatedMasterKey;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch {}
    document.body.removeChild(ta);
  }
  if (!ok) {
    alert("Copy failed — select the key in the box and copy it manually.");
    return;
  }
  const ackBtn = $("ack-master-key");
  if (ackBtn) ackBtn.disabled = false;
}

// Acknowledge the generated key: the gateway clears it from memory (persisting
// any pending legacy migration first) and the banner is removed. A failed ACK
// (e.g. migration persist error) keeps the banner so the user can retry.
async function ackMasterKey() {
  try {
    await api("/api/secrets/master-key/ack", { method: "POST" });
    const b = $("master-key-banner");
    if (b) b.remove();
  } catch (e) { alert(e.message); }
}

/* ---------- init ---------- */
renderFilters();
renderUsageFilters();
switchView("providers");
loadMasterKeyBanner();
// Deep-link support: "#session=<id>" (from the per-row "new tab" anchors or a
// manually built URL) opens the traces view and loads that session on load.
const initialSession = hashSessionId();
if (initialSession) {
  switchView("traces");
  openSession(initialSession);
}
</script>
</body>
