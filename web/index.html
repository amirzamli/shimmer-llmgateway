<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shimmer Gateway</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e9ef; --text2: #c6cdd9; --muted: #a3adbd; --accent: #4f8cff;
    --ok: #2ecc71; --warn: #f1c40f; --err: #e74c3c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 20px; }
  header h1 { font-size: 16px; margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  nav button.active { color: var(--text); background: var(--panel); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  button { background: var(--accent); border: none; color: white; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  button.outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  button.outline:hover { background: rgba(79,140,255,.12); }
  button.danger-ghost { background: transparent; border: 1px solid transparent; color: var(--err); }
  button.danger-ghost:hover { border-color: var(--err); }
  .btn-sm { padding: 3px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  code, pre { font-family: ui-monospace, monospace; font-size: 12px; }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; overflow: auto; max-height: 400px; }
  .badge { padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .badge.ok { background: rgba(46,204,113,.15); color: var(--ok); }
  .badge.warn { background: rgba(241,196,15,.15); color: var(--warn); }
  .badge.err { background: rgba(231,76,60,.15); color: var(--err); }
  .badge.disabled { background: rgba(154,163,178,.15); color: var(--muted); }
  .muted { color: var(--muted); font-size: 12px; }
  .msg { margin: 6px 0; padding: 8px 10px; border-left: 3px solid var(--border); background: var(--bg); border-radius: 4px; }
  .msg.user { border-left-color: var(--accent); }
  .msg.assistant { border-left-color: var(--ok); }
  .msg.tool { border-left-color: var(--warn); }
  /* chat-style trace windows: user bubbles right, assistant/system/tool left */
  .chat { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
  .chat .msg { margin: 0; max-width: 85%; border-left: none; border-radius: 10px; word-break: break-word; white-space: pre-wrap; }
  .chat .msg.user { align-self: flex-end; background: rgba(79,140,255,.15); }
  .chat .msg.assistant { align-self: flex-start; background: rgba(46,204,113,.1); }
  .chat .msg.system { align-self: flex-start; background: rgba(154,163,178,.12); }
  .chat .msg.tool { align-self: flex-start; width: 100%; max-width: 100%; background: rgba(241,196,15,.08); }
  .chat-window { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding: 12px 14px; margin: 14px 0; }
  .verdict { font-size: 11px; padding: 1px 8px; border-radius: 10px; }
  .verdict.SUCCESS { background: rgba(46,204,113,.2); color: var(--ok); }
  .verdict.RECOVERABLE { background: rgba(241,196,15,.2); color: var(--warn); }
  .verdict.BLIND_ERROR { background: rgba(231,76,60,.2); color: var(--err); }
  .chat-role { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; letter-spacing: .02em; text-transform: uppercase; }
  .chat-content { white-space: pre-wrap; }
  .tool-call { margin-top: 6px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .tool-call pre { margin: 4px 0 0; max-height: 220px; }
  .tool-result { margin-top: 6px; padding: 6px 8px; background: var(--bg); border-left: 3px solid var(--warn); border-radius: 6px; }
  .tool-result pre { margin: 4px 0 0; max-height: 320px; }
  a.newtab { color: var(--muted); font-size: 12px; margin-left: 8px; text-decoration: none; }
  a.newtab:hover { color: var(--accent); text-decoration: underline; }
  .clickable { cursor: pointer; text-decoration: underline; }
  .hidden { display: none; }
  #master-key-banner { border-left: 4px solid var(--warn); }
  #master-key-banner code { word-break: break-all; }
  .usage { display: flex; flex-direction: column; gap: 10px; min-width: 240px; }
  .usage-item { display: flex; flex-direction: column; gap: 3px; }
  .usage-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .usage-label { color: var(--muted); font-size: 12px; }
  .usage-value { font-weight: 600; font-size: 13px; }
  .progress { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
  .progress-bar { background: var(--accent); height: 100%; }
  .reset-time { color: var(--muted); font-size: 11px; }
  .aliases-instance { border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; background: rgba(255,255,255,0.015); margin-bottom: 12px; }
  .aliases-instance summary { cursor: pointer; user-select: none; font-weight: 500; outline: none; display: flex; align-items: center; gap: 10px; padding: 4px 0; border-radius: 4px; transition: background .15s ease; }
  .aliases-instance summary:hover { background: rgba(255,255,255,0.045); }
  .aliases-instance summary:hover .aliases-caret { color: var(--accent); }
  /* the whole summary row is the drag handle: dragging reorders priority */
  .instance-summary { cursor: grab; }
  .instance-summary:active { cursor: grabbing; }
  .drag-grip { color: var(--muted); font-size: 12px; letter-spacing: -2px; user-select: none; }
  .instance-row.dragging { opacity: .45; }
  .instance-row.drop-above { box-shadow: 0 -2px 0 0 var(--accent); }
  .instance-row.drop-below { box-shadow: 0 2px 0 0 var(--accent); }
  .aliases-caret { display: inline-block; font-size: 10px; line-height: 1; color: var(--muted); transform: rotate(0deg); transition: transform .15s ease; }
  .aliases-instance[open] .aliases-caret { transform: rotate(90deg); }
  .aliases-summary-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .instance-summary .spacer { flex: 1; }
  .instance-summary .badge { flex-shrink: 0; }
  /* compact quota summary inline in the instance header */
  .instance-quota { display: flex; align-items: center; }
  .instance-quota .usage { min-width: 0; flex-direction: row; flex-wrap: wrap; gap: 2px 14px; }
  .instance-quota .usage-item { flex-direction: row; align-items: baseline; gap: 5px; }
  .instance-quota .progress { display: none; }
  .instance-quota .usage-header { gap: 5px; }
  .instance-body { margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); }
  /* "Add instance" lives in the Instances panel header: blue with a subtle
     glow; the form it reveals sits between the header and the provider rows. */
  #add-instance-toggle { background: var(--accent); box-shadow: 0 0 10px rgba(79,140,255,.45), 0 0 2px rgba(79,140,255,.65); }
  #add-instance-toggle:hover { box-shadow: 0 0 14px rgba(79,140,255,.6), 0 0 3px rgba(79,140,255,.8); }
  #instances-panel > h2 { display: flex; align-items: center; gap: 10px; }
  #instances-panel > h2 .spacer { flex: 1; }
  #add-instance-form { border: 1px dashed var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; background: rgba(255,255,255,0.015); }
  #add-instance-form .row label { min-width: 150px; }
  #add-instance-form .templates-fold { margin-top: 12px; }
  /* Combined Settings page (general settings + gateway status + plugins) */
  .setting { display: flex; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .setting:last-child { border-bottom: none; }
  .setting-label { width: 230px; flex-shrink: 0; font-size: 13px; font-weight: 500; padding-top: 6px; }
  .setting-control { flex: 1; min-width: 240px; }
  .setting-desc { color: var(--text2); font-size: 12px; margin-top: 4px; line-height: 1.5; }
  .status-cols { display: flex; gap: 28px; flex-wrap: wrap; }
  .status-cols > table { flex: 1; min-width: 260px; }
  .plugin-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; background: rgba(255,255,255,0.015); }
 .inst-plugins-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
 .plugin-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; background: rgba(255,255,255,0.03); }
 .plugin-chip .chip-x { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }
 .plugin-chip .chip-x:hover { color: var(--err); }
 .plugin-add-wrap { position: relative; display: inline-block; }
 .plugin-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; min-width: 260px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
 .plugin-menu button { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 6px 8px; border-radius: 6px; }
  .plugin-menu button:hover { background: rgba(255,255,255,.06); }
  .plugin-menu button .muted { font-size: 11px; white-space: normal; }
  /* Expanded provider card: labelled subsections (Aliases / Plugins /
     Connection) plus a form-level footer, so scope of each action is
     unambiguous — local triggers live in their section header or chip row,
     Save/Cancel alone in the card footer. */
  .instance-section { margin-top: 16px; }
  .instance-section:first-child { margin-top: 0; }
  .instance-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .instance-section-title { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .instance-section-head .spacer { flex: 1; }
  .instance-footer { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .instance-footer .spacer { flex: 1; }
  /* instance header actions: subdued group, destructive delete stays ghost */
  .instance-actions { display: flex; gap: 6px; flex-shrink: 0; }
  /* alias table: fixed column proportions + full-width editors */
  .aliases-table th:nth-child(1), .aliases-table td:nth-child(1) { width: 24%; }
  .aliases-table th:nth-child(2), .aliases-table td:nth-child(2) { width: 40%; }
  .aliases-table th:nth-child(3), .aliases-table td:nth-child(3) { width: 18%; }
  .aliases-table th:nth-child(4), .aliases-table td:nth-child(4) { width: 18%; }
  .aliases-table input, .aliases-table select { width: 100%; }
  .aliases-empty td { border: 1px dashed var(--border); padding: 16px; text-align: center; color: var(--muted); font-size: 12px; }
  .aliases-empty button { margin-left: 8px; }
  /* inline dashed "+ Add plugin" trigger trailing the chip row */
  .chip-add { background: transparent; border: 1px dashed var(--border); color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .chip-add:hover { color: var(--accent); border-color: var(--accent); }
  /* Connection subsection: read-only label/value grid */
  .connection-grid { display: grid; grid-template-columns: 150px 1fr; gap: 5px 14px; font-size: 12px; margin: 0; }
  .connection-grid dt { color: var(--muted); }
  .connection-grid dd { margin: 0; color: var(--text2); word-break: break-all; }
  .plugin-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .plugin-head .plugin-info { flex: 1; min-width: 260px; }
  .plugin-desc { color: var(--text2); font-size: 12px; line-height: 1.55; margin-top: 4px; }
  .plugin-scope { color: var(--text2); font-size: 11px; margin-top: 4px; }
  .plugin-card textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; }
  .plugin-config { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .plugin-config summary { user-select: none; color: var(--text2); }
  .instructions ol { margin: 8px 0; padding-left: 22px; }
  .instructions li { margin-bottom: 10px; line-height: 1.5; }
  .instructions p { line-height: 1.5; }
  .instructions pre { margin: 6px 0; }
</style>
</head>
<body>
<header>
  <h1>Shimmer Gateway</h1>
  <nav id="nav">
    <button data-action="view" data-view="providers" class="active">Providers</button>
    <button data-action="view" data-view="settings">Settings</button>
    <button data-action="view" data-view="traces">Traces</button>
    <button data-action="view" data-view="usage">Usage</button>
  </nav>
</header>
<main>
  <section id="view-providers"></section>
  <section id="view-settings" class="hidden"></section>
  <section id="view-traces" class="hidden"></section>
  <section id="view-usage" class="hidden"></section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let templates = [];
let instances = [];
// Quota entries from GET /api/quota (internal/quota), rendered inline in the
// combined Instances panel of the Providers view.
let quota = [];
// Per-instance provider model lists and fetch metadata for the alias editor,
// populated by fetchModels from GET /api/instances/{alias}/models.
let fetchedModels = {}; // alias -> string[] of available model ids
let fetchedMeta = {};   // alias -> {source, fetched_at, error}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) {
    const msg = body && body.message ? body.message : (typeof body === "string" ? body : "request failed");
    throw new Error(msg);
  }
  return body;
}
// HTML-escape for text and double-quoted attribute contexts. Values rendered
// into data-* attributes are read back via el.dataset (never interpolated
// into JS strings), so no client-controlled value can execute in a JS
// context.
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// toObj coerces a JSON field that arrives as an object (json.RawMessage on
// the Go side) or a JSON string into an object, or null. JSON.parse on an
// object stringifies it to "[object Object]" and throws, so it is never
// applied to non-strings.
function toObj(v) {
  if (v == null) return null;
  if (typeof v === "string") { try { return JSON.parse(v); } catch { return null; } }
  return v;
}
function jsonish(s) {
  const o = toObj(s);
  return o == null ? String(s || "") : JSON.stringify(o, null, 2);
}

/* ---------- event delegation ----------
 * Every interactive element carries data-action (+ data-* payload) and is
 * handled here; no inline onclick and no data interpolated into JS strings.
 */
document.addEventListener("click", function (ev) {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  // Row buttons (Edit/Enable/Disable/Delete) live inside the draggable
  // summary; without this the click would also toggle the aliases list.
  if (el.closest("summary")) ev.preventDefault();
  switch (el.dataset.action) {
    case "view": switchView(el.dataset.view); break;
    case "add-instance": addInstance(); break;
    case "toggle-add": toggleAddForm(); break;
    case "edit-instance": editInstance(el.dataset.alias); break;
    case "toggle-instance": toggleInstance(el.dataset.alias); break;
    case "delete-instance": deleteInstance(el.dataset.alias); break;
    case "models-refresh": refreshModels(el.dataset.alias); break;
    case "quota-refresh": refreshQuota(); break;
    case "aliases-add": addAliasRow(el.dataset.alias); break;
    case "aliases-remove": removeAliasRow(el); break;
    case "instance-save": saveInstance(el.dataset.alias); break;
    case "instance-cancel": cancelInstanceEdits(el.dataset.alias); break;
    case "plugins-menu": togglePluginMenu(el); break;
    case "plugins-pick": pickPlugin(el); break;
    case "plugins-remove": removePluginChip(el); break;
    case "save-settings": saveSettings(); break;
    case "plugin-toggle": togglePlugin(el.dataset.name); break;
    case "plugin-save-config": savePluginConfig(el.dataset.name); break;
    case "search-sessions": loadSessions(); break;
    case "search-usage": searchUsage(); break;
    case "usage-chart-metric": setChartMetric(el.dataset.metric); break;
    case "open-session": openSession(el.dataset.id); break;
    case "export-session": exportSession(el.dataset.id); break;
    case "back": loadSessions(); break;
    case "copy-master-key": copyMasterKey(); break;
    case "ack-master-key": ackMasterKey(); break;
  }
});

// Clicks outside an open "Add plugin" popup close it (the delegation handler
// above has already handled the click when the target was inside).
document.addEventListener("click", function (ev) {
  document.querySelectorAll(".plugin-menu").forEach(m => {
    if (!m.classList.contains("hidden") && !m.parentElement.contains(ev.target)) m.classList.add("hidden");
  });
});

/* ---------- navigation ---------- */
function switchView(view) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  $("view-" + view).classList.remove("hidden");
  loadView(view);
}
async function loadView(v) {
  try {
    if (v === "providers") { await loadProviders(); }
    else if (v === "settings") { await loadSettings(); }
    else if (v === "traces") { /* filters on demand */ }
    else if (v === "usage") { await loadUsage(); }
  } catch (e) { alert(e.message); }
}

/* ---------- Providers ---------- */
async function loadProviders() {
  const [t, i, q, p] = await Promise.all([api("/api/templates"), api("/api/instances"), api("/api/quota"), api("/api/plugins")]);
  templates = t.templates; instances = i.instances; quota = (q && q.quota) || [];
  pluginsData = p;
  // Pre-fetch each instance's provider model list (server-cached for 5 min)
  // so the alias editor can offer them; fetchModels never throws.
  await Promise.all(instances.map(x => fetchModels(x.alias)));
  const tmplOptions = templates.map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");
  $("view-providers").innerHTML = `
    ${renderInstances(tmplOptions)}`;
  const sel = $("add-template");
  sel.addEventListener("change", applyTemplatePrefill);
  applyTemplatePrefill();
}
function suggestAlias(template) {
  const count = instances.filter(i => i.template === template).length;
  const base = templates.find(t => t.name === template) ? template : "";
  return count === 0 ? base : base + "-" + (count + 1);
}
async function addInstance() {
  const body = { template: $("add-template").value, alias: $("add-alias").value || undefined };
  const endpoint = $("add-endpoint").value.trim();
  if (isCustomTemplate(body.template) && !endpoint) {
    alert("An endpoint URL is required for " + body.template + ": point it at any OpenAI- or Anthropic-compatible server, including local ones (e.g. http://localhost:8080/v1).");
    return;
  }
  if (endpoint) body.base_url = endpoint;
  const key = $("add-key").value;
  if (key) body.key = key;
  try {
    await api("/api/instances", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    await loadProviders();
  } catch (e) { alert(e.message); }
}
async function editInstance(alias) {
  const inst = instances.find(x => x.alias === alias);
  if (!inst) return;
  const newAlias = prompt("Alias:", inst.alias);
  if (newAlias == null) return;
  const key = prompt("Replace key (leave empty to keep, type '-' to clear):", "");
  const patch = {};
  if (newAlias.trim() && newAlias.trim() !== inst.alias) patch.alias = newAlias.trim();
  if (key === "-") patch.key = "";
  else if (key) patch.key = key;
  try {
    await api("/api/instances/" + encodeURIComponent(inst.alias), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) });
    await loadProviders();
  } catch (e) { alert(e.message); }
}
async function toggleInstance(alias) {
  try {
    const inst = instances.find(x => x.alias === alias);
    const disabling = !inst.disabled;
    await api("/api/instances/" + encodeURIComponent(alias), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ disabled: disabling }) });
    // A disabled provider's alias list collapses by default; clear any stored
    // open state so the collapse sticks after a reload.
    if (disabling) {
      const s = aliasOpenState();
      s[alias] = false;
      try { localStorage.setItem(ALIAS_OPEN_KEY, JSON.stringify(s)); } catch {}
    }
    await loadProviders();
  } catch (e) { alert(e.message); }
}
async function deleteInstance(alias) {
  if (!confirm("Delete instance " + alias + "?")) return;
  try {
    await api("/api/instances/" + encodeURIComponent(alias), { method: "DELETE" });
    await loadProviders();
  } catch (e) { alert(e.message); }
}

// routingCompare mirrors the server's routing order: enabled instances before
// disabled, then explicit priority ascending (unset = last, keeping file
// order). Array.prototype.sort is stable, so equal items keep config order.
function routingCompare(a, b) {
  if (a.disabled !== b.disabled) return a.disabled ? 1 : -1;
  const pa = a.priority || 0, pb = b.priority || 0;
  if (pa && pb) return pa - pb;
  if (pa) return -1;
  if (pb) return 1;
  return 0;
}

// instanceBlockHtml renders one provider as a collapsible row whose header is
// the drag handle: enabled instances render above disabled ones (in routing
// order), the alias editor lives directly under each provider, and dragging a
// header reorders routing priority (top of the list = highest priority).
function instanceBlockHtml(x) {
  // Custom per-endpoint templates show the endpoint instead of the long
  // generated template name; anthropic-style providers get a badge.
  const tmplLabel = x.template && x.template.startsWith("custom-") && x.base_url ? x.base_url : x.template;
  const styleBadge = x.style === "anthropic" ? `<span class="badge warn" title="Anthropic Messages API">anthropic</span>` : "";
  return `<details class="aliases-instance instance-row" data-alias="${esc(x.alias)}" ${persistedAliasOpen(x.alias, !!x.disabled) ? "open" : ""}>
    <summary class="instance-summary" draggable="true">
      <span class="drag-grip" aria-hidden="true" title="Drag to reorder">⋮⋮</span>
      <span class="aliases-caret" aria-hidden="true">▶</span>
      <span class="aliases-summary-title">${esc(x.alias)}</span>
      <span class="muted">${esc(tmplLabel)}</span>
      ${styleBadge}
      ${x.disabled ? `<span class="badge disabled">disabled</span>` : `<span class="badge ok">enabled</span>`}
      <span class="instance-quota">${quotaCellFor(x.alias)}</span>
      <span class="spacer"></span>
      <span class="instance-actions">
        <button class="ghost btn-sm" data-action="edit-instance" data-alias="${esc(x.alias)}">Edit</button>
        <button class="ghost btn-sm" data-action="toggle-instance" data-alias="${esc(x.alias)}">${x.disabled ? "Enable" : "Disable"}</button>
        <button class="danger-ghost btn-sm" data-action="delete-instance" data-alias="${esc(x.alias)}">Delete</button>
      </span>
    </summary>
    <div class="instance-body">
      <datalist id="dl-models-${esc(x.alias)}">${modelOptions(x.alias)}</datalist>
      <div class="instance-section">
        <div class="instance-section-head">
          <span class="instance-section-title">Aliases</span>
          <span class="muted" id="models-status-${esc(x.alias)}">${aliasesStatus(x.alias)}</span>
          <span class="spacer"></span>
          <button class="ghost btn-sm" data-action="models-refresh" data-alias="${esc(x.alias)}" title="Re-fetch the model list from this provider">Refresh models</button>
          <button class="outline btn-sm" data-action="aliases-add" data-alias="${esc(x.alias)}">+ Add alias</button>
        </div>
        <table class="aliases-table">
          <thead><tr><th>Alias name</th><th>Model</th><th>Reasoning</th><th></th></tr></thead>
          <tbody id="aliases-body-${esc(x.alias)}">${renderAliasRows(x)}</tbody>
        </table>
      </div>
      ${instancePluginsHtml(x)}
      ${instanceConnectionHtml(x)}
      <div class="instance-footer">
        <span class="muted">Alias and plugin changes are staged until you save.</span>
        <span class="spacer"></span>
        <button class="ghost" data-action="instance-cancel" data-alias="${esc(x.alias)}">Cancel</button>
        <button data-action="instance-save" data-alias="${esc(x.alias)}" title="Saves the model aliases and the plugin list for this provider">Save</button>
      </div>
    </div>
  </details>`;
}

// instanceConnectionHtml renders the read-only Connection subsection: how the
// provider is reached (protocol, endpoint, credential) plus its routing
// priority. Values come from config/secrets and are esc()'d.
function instanceConnectionHtml(x) {
  const key = x.key_masked
    ? `<code>${esc(x.key_masked)}</code>`
    : (x.api_key_env ? `<code>env: ${esc(x.api_key_env)}</code>` : `<span class="muted">none</span>`);
  return `<div class="instance-section">
    <div class="instance-section-head"><span class="instance-section-title">Connection</span></div>
    <dl class="connection-grid">
      <dt>Protocol</dt><dd>${esc(x.style || "openai")}</dd>
      <dt>Endpoint</dt><dd>${x.base_url ? `<code>${esc(x.base_url)}</code>` : `<span class="muted">—</span>`}</dd>
      <dt>Credential</dt><dd>${key}</dd>
      <dt>Routing priority</dt><dd>${x.priority ? esc(String(x.priority)) + " <span class=\"muted\">(1 = highest)</span>" : `<span class="muted">unset — list order</span>`}</dd>
    </dl>
  </div>`;
}

/* ---------- per-provider plugins (Providers view) ---------- */
// effectivePluginNames returns the chain an instance actually runs: its own
// plugins list when set (an instance list replaces the global chain entirely),
// otherwise the global request/response defaults deduped in order.
function effectivePluginNames(inst) {
  if (inst.plugins != null) return inst.plugins || [];
  const req = pluginsData.request_plugins || [];
  const resp = pluginsData.response_plugins || [];
  return req.concat(resp.filter(n => !req.includes(n)));
}
// instancePluginsHtml renders the provider's plugin chain as a list of chips
// staged client-side — the list shows exactly what runs for this provider now,
// and edits (removing a chip, adding via the inline "+ Add plugin" popup)
// stay unsaved until the provider's Save button is pressed, exactly like the
// alias rows above. While the provider follows the global defaults the list is
// that effective set and saving a changed list writes an explicit override; a
// "custom" list replaces the global chain entirely (empty = plugins off for
// this provider).
function instancePluginsHtml(x) {
  const inherit = x.plugins == null;
  const names = effectivePluginNames(x);
  const chips = names.map(n => pluginChipHtml(x.alias, n)).join("")
    || `<span class="muted none-placeholder" style="font-size:12px">none</span>`;
  return `<div class="instance-section" id="inst-plugins-${esc(x.alias)}" data-alias="${esc(x.alias)}">
    <div class="instance-section-head">
      <span class="instance-section-title">Plugins</span>
      ${inherit
        ? `<span class="badge disabled" title="Following the global enable/disable toggles (Settings → Plugins). Saving a changed list here overrides them for this provider only.">global defaults</span>`
        : `<span class="badge warn" title="Custom list — replaces the global defaults for this provider entirely.">custom</span>`}
    </div>
    <div class="inst-plugins-list">${chips}<span class="plugin-add-wrap"><button class="chip-add" data-action="plugins-menu" data-alias="${esc(x.alias)}">+ Add plugin</button><div class="plugin-menu hidden"></div></span></div>
  </div>`;
}
// pluginChipHtml renders one staged plugin chip; the × only removes the chip
// client-side (unsaved until Save, like the alias rows).
function pluginChipHtml(alias, name) {
  const info = (pluginsData.plugins || []).find(p => p.name === name);
  return `<span class="plugin-chip" data-name="${esc(name)}" title="${esc((info && info.description) || name)}">${esc(name)}
    <button class="chip-x" data-action="plugins-remove" title="Remove ${esc(name)} from this provider (applied when you press Save)" aria-label="Remove ${esc(name)}">×</button>
  </span>`;
}
// stagedPluginNames reads the provider's staged plugin list back from the DOM
// (the chips are the staging area, so no extra state to keep in sync).
function stagedPluginNames(alias) {
  const root = document.getElementById("inst-plugins-" + alias);
  return root ? Array.from(root.querySelectorAll(".plugin-chip")).map(c => c.dataset.name) : [];
}
// pluginsPatchValue returns the explicit plugins list to include in a save
// PATCH, or undefined when the staged list equals what the instance already
// runs — so plain alias edits never silently convert an inheriting provider
// into a custom list.
function pluginsPatchValue(inst, staged) {
  const current = effectivePluginNames(inst);
  const same = staged.length === current.length && staged.every((n, i) => n === current[i]);
  return same ? undefined : staged;
}
// pluginMenuItems builds the popup contents: one entry per known plugin not
// yet staged as a chip (so a just-removed plugin can be re-added without a
// reload), or a muted note when everything is already staged.
function pluginMenuItems(alias, staged) {
  const items = (pluginsData.plugins || []).filter(p => !staged.includes(p.name));
  return items.length
    ? items.map(p => `<button data-action="plugins-pick" data-alias="${esc(alias)}" data-name="${esc(p.name)}" title="${esc(p.description || "")}"><span>${esc(p.name)}</span><span class="muted">${esc(p.description || "")}</span></button>`).join("")
    : `<div class="muted" style="padding:6px 8px">all plugins added</div>`;
}
// togglePluginMenu opens the "Add plugin" popup, rebuilding its items from the
// plugins not currently staged as chips.
function togglePluginMenu(el) {
  const wrap = el.closest(".plugin-add-wrap");
  const menu = wrap && wrap.querySelector(".plugin-menu");
  if (!menu) return;
  if (!menu.classList.contains("hidden")) { menu.classList.add("hidden"); return; }
  menu.innerHTML = pluginMenuItems(el.dataset.alias, stagedPluginNames(el.dataset.alias));
  menu.classList.remove("hidden");
}
// pickPlugin stages the chosen plugin as a chip (deduped) ahead of the inline
// "+ Add plugin" trigger and closes the popup.
function pickPlugin(el) {
  const alias = el.dataset.alias;
  const name = el.dataset.name;
  const root = document.getElementById("inst-plugins-" + alias);
  const list = root && root.querySelector(".inst-plugins-list");
  if (!list || stagedPluginNames(alias).includes(name)) return;
  const none = list.querySelector(".none-placeholder");
  if (none) none.remove();
  const wrap = list.querySelector(".plugin-add-wrap");
  if (wrap) wrap.insertAdjacentHTML("beforebegin", pluginChipHtml(alias, name));
  else list.insertAdjacentHTML("beforeend", pluginChipHtml(alias, name));
  const menu = el.closest(".plugin-menu");
  if (menu) menu.classList.add("hidden");
}
// removePluginChip unstages a chip; removing the last one restores the "none"
// placeholder (both unsaved until Save).
function removePluginChip(el) {
  const chip = el.closest(".plugin-chip");
  const list = chip && chip.parentElement;
  if (chip) chip.remove();
  if (list && !list.querySelector(".plugin-chip") && !list.querySelector(".none-placeholder")) {
    const wrap = list.querySelector(".plugin-add-wrap");
    const html = `<span class="muted none-placeholder" style="font-size:12px">none</span>`;
    if (wrap) wrap.insertAdjacentHTML("beforebegin", html);
    else list.insertAdjacentHTML("beforeend", html);
  }
}

// renderInstances builds the merged Providers list: each instance is a
// collapsible row (aliases editor inside), enabled first, then disabled, each
// group in routing order. The header carries the Add-instance toggle (blue,
// glowing) whose click reveals the inline form with the endpoint URL field
// for custom providers. refreshQuota re-renders only this panel in place.
function renderInstances(tmplOptions) {
  if (tmplOptions == null) {
    tmplOptions = templates.map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");
  }
  const sorted = instances.slice().sort(routingCompare);
  return `<div class="panel" id="instances-panel">
    <h2>Instances
      <span class="spacer"></span>
      <button id="add-instance-toggle" data-action="toggle-add">+ Add instance</button>
      <button class="ghost" data-action="quota-refresh">Refresh</button>
    </h2>
    <div class="muted" style="margin-bottom:12px">Enabled providers are listed first, disabled ones below. <b>Drag a provider's header to reorder it — top of the list is highest priority</b> for unprefixed model names (e.g. <code>small</code>). Click a header to expand its model aliases.</div>
    <div id="add-instance-form" class="hidden">
      <div class="row">
        <label>Template
          <select id="add-template">${tmplOptions}</select>
        </label>
        <label>Alias (auto-filled)
          <input id="add-alias" placeholder="auto">
        </label>
        <label>Endpoint URL <span class="muted" id="endpoint-hint"></span>
          <input id="add-endpoint" type="url" placeholder="https://api.example.com/v1">
        </label>
        <label>Key (optional) <span class="muted" id="key-hint"></span>
          <input id="add-key" type="password" placeholder="sk-...">
        </label>
        <button data-action="add-instance">Add</button>
        <button class="ghost" data-action="toggle-add">Cancel</button>
      </div>
      <details class="templates-fold"><summary class="clickable muted">Templates</summary>
        <table style="margin-top:8px"><thead><tr><th>Name</th><th>Style</th><th>Base URL</th><th>Key env</th><th>Models</th></tr></thead>
        <tbody>
          ${templates.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.style || "openai")}</td><td>${esc(x.base_url) || '<span class="muted">endpoint required</span>'}</td><td>${esc(x.api_key_env)}</td><td class="muted">${esc((x.models||[]).join(", "))}</td></tr>`).join("")}
        </tbody></table>
      </details>
    </div>
    ${sorted.map(instanceBlockHtml).join("")}
  </div>`;
}

// isCustomTemplate reports whether the selected (or given) template is the
// endpoint-less custom placeholder that requires an endpoint URL.
function isCustomTemplate(template) {
  const name = template || $("add-template").value;
  return name === "custom_openai" || name === "custom_anthropic";
}

// applyTemplatePrefill fills the template-specific form fields when a template
// is selected (or the form is opened): endpoint URL from the template's
// base_url, a key-hint naming the env var the template reads, plus the
// auto-suggested alias. The endpoint stays editable — it doubles as the
// custom-provider override.
function applyTemplatePrefill() {
  const sel = $("add-template");
  const t = templates.find(x => x.name === sel.value);
  const endpoint = $("add-endpoint"), keyHint = $("key-hint");
  if (t) {
    endpoint.value = t.base_url || "";
    keyHint.textContent = t.api_key_env ? "env: " + t.api_key_env : "";
  } else {
    endpoint.value = "";
    keyHint.textContent = "";
  }
  $("add-key").value = "";
  $("add-alias").value = "";
  $("add-alias").placeholder = "auto: " + suggestAlias(sel.value);
  updateEndpointHint();
}

// updateEndpointHint marks the endpoint URL as required for the custom
// placeholders and explains the field otherwise.
function updateEndpointHint() {
  const endpoint = $("add-endpoint");
  if (!endpoint) return;
  if (isCustomTemplate()) {
    endpoint.required = true;
    $("endpoint-hint").textContent = "required for " + $("add-template").value;
  } else {
    endpoint.required = false;
    $("endpoint-hint").textContent = "optional — override any provider, incl. local servers";
  }
}

// toggleAddForm expands/collapses the inline add-instance form; opening it
// pre-fills the template-specific fields for the current selection.
function toggleAddForm() {
  const form = $("add-instance-form");
  if (!form) return;
  const opening = form.classList.toggle("hidden");
  if (opening) {
    applyTemplatePrefill();
    $("add-alias").focus();
  }
}

/* ---------- Quota ---------- */
// Quota entries are per-instance and rendered inline in the combined
// Instances panel (renderInstances). Window keys and value labels are
// provider-controlled, so every interpolated value is esc()'d.
// quotaCellFor looks up the quota entry for an instance alias and reuses the
// quotaCell logic; aliases without a quota row get a muted placeholder.
function quotaCellFor(alias) {
  const entry = quota.find(q => q.alias === alias);
  return entry ? quotaCell(entry) : `<span class="muted">—</span>`;
}
// Friendly labels and canonical order for known window keys (OpenCode Go
// exposes 5h/weekly/monthly). The backend JSON map is alphabetically ordered,
// so the UI imposes this order for readability.
const WINDOW_LABELS = {
  "5h": "Rolling Usage", "weekly": "Weekly Usage", "monthly": "Monthly Usage",
  "credits_balance": "Balance", "credits": "Credits", "usage": "Usage"
};
const WINDOW_ORDER = ["5h", "weekly", "monthly"];

// quotaCell renders the quota summary for one result: gaps are muted labels,
// fetch failures show a red badge, percent windows render as an OpenCode-style
// usage card (label + value + progress bar + reset time), and balance windows
// render as a single inline code line.
function quotaCell(x) {
  if (!x.supported) {
    if (x.usage_url) {
      return `<a class="usage-link muted" href="${esc(x.usage_url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">view usage ↗</a>`;
    }
    return `<span class="muted">not supported</span>`;
  }
  if (!x.configured) return `<span class="muted">no key</span>`;
  if (!x.ok) return `<span class="badge err">${esc(x.error || "unknown error")}</span>`;
  const windows = x.windows || {};
  const keys = [
    ...WINDOW_ORDER.filter(k => windows[k]),
    ...Object.keys(windows).filter(k => !WINDOW_ORDER.includes(k)).sort()
  ];
  const items = keys.map(k => windowItem(WINDOW_LABELS[k] || k, windows[k]));
  return items.length ? `<div class="usage">${items.join("")}</div>` : `<span class="muted">no data</span>`;
}

// windowItem renders one window. Percent windows (OpenCode Go) get the full
// usage card; balance windows (DeepSeek/OpenRouter) are a single code line.
function windowItem(label, w) {
  if (w.used_percent != null) return usageItem(label, w);
  const val = w.value_label != null && w.value_label !== "" ? w.value_label : "";
  return `<code>${esc(label)}: ${esc(val)}</code>`;
}

// usageItem renders the OpenCode-style usage card: header (label + value), a
// progress bar, and the reset time. used_percent is clamped and rounded.
function usageItem(label, w) {
  const pct = Math.max(0, Math.min(100, Math.round(w.used_percent)));
  const reset = resetLabel(w.reset_at);
  return `<div class="usage-item">
    <div class="usage-header"><span class="usage-label">${esc(label)}</span><span class="usage-value">${pct}%</span></div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    ${reset ? `<span class="reset-time">${esc(reset)}</span>` : ""}
  </div>`;
}

// resetLabel formats a unix-millisecond reset time as "Resets in 3 hours
// 0 minutes" or "Resets in 6 days 13 hours", mirroring the OpenCode usage UI.
function resetLabel(resetAtMs) {
  if (resetAtMs == null) return "";
  const ms = resetAtMs - Date.now();
  if (ms <= 0) return "Resets soon";
  const totalMinutes = Math.floor(ms / 60000);
  if (totalMinutes < 1) return "Resets in less than a minute";
  const days = Math.floor(totalMinutes / 1440);
  if (days >= 1) {
    const hours = Math.floor((totalMinutes % 1440) / 60);
    return `Resets in ${days} day${days === 1 ? "" : "s"} ${hours} hour${hours === 1 ? "" : "s"}`;
  }
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  return `Resets in ${hours} hour${hours === 1 ? "" : "s"} ${minutes} minute${minutes === 1 ? "" : "s"}`;
}
// refreshQuota re-fetches /api/quota bypassing the server-side TTL cache and
// re-renders only the combined Instances + Quota panel in place, so the Add
// instance form and the folded Templates section keep their state.
async function refreshQuota() {
  try {
    const q = await api("/api/quota?refresh=1");
    quota = (q && q.quota) || [];
    const pane = $("instances-panel");
    if (pane) pane.outerHTML = renderInstances();
  } catch (e) { alert(e.message); }
}

/* ---------- Model aliases editor ---------- */
// Aliases-panel collapse state is persisted per instance in localStorage so
// the user's collapsed/expanded choices survive refreshes and reloads:
//   - a stored value wins outright (their explicit choice),
//   - otherwise an enabled instance defaults to expanded and a disabled one
//     to collapsed, so newly enabled providers show up expanded by default.
const ALIAS_OPEN_KEY = "shimmer.aliasOpen.v1";
function aliasOpenState() {
  try { return JSON.parse(localStorage.getItem(ALIAS_OPEN_KEY)) || {}; } catch { return {}; }
}
// Stored choices win outright; aliases never explicitly toggled fall back to
// enabled=expanded / disabled=collapsed, so newly enabled providers appear
// expanded without clobbering explicit choices.
function aliasOpenWithDefaults() {
  const s = aliasOpenState();
  (instances || []).forEach(x => { if (s[x.alias] == null) s[x.alias] = !x.disabled; });
  return s;
}
function persistedAliasOpen(alias, disabled) {
  const s = aliasOpenState();
  return s[alias] != null ? !!s[alias] : !disabled;
}
function aliasOpenToggle(alias, open) {
  const s = aliasOpenWithDefaults();
  s[alias] = open;
  try { localStorage.setItem(ALIAS_OPEN_KEY, JSON.stringify(s)); } catch {}
}
document.addEventListener("toggle", function (ev) {
  const d = ev.target;
  if (!(d instanceof HTMLDetailsElement) || !d.classList.contains("aliases-instance")) return;
  // A re-render (save, refresh) removes the old <details>, which fires a
  // toggle with open=false — that is not a user choice and must not persist,
  // or every save would collapse panels the user had opened.
  if (!document.contains(d)) return;
  aliasOpenToggle(d.dataset.alias, d.open);
});

/* ---------- drag-to-reorder (routing priority) ---------- */
// The whole provider header row is draggable: dragging reorders the merged
// instance list, and on drop the new order is persisted via
// PUT /api/instances/order (position → priority, top = highest).
let dragAlias = null;
function instanceRowFor(el) {
  return el ? el.closest("details.instance-row") : null;
}
function rowDropSide(sum, ev) {
  const rect = sum.getBoundingClientRect();
  return ev.clientY < rect.top + rect.height / 2 ? "drop-above" : "drop-below";
}
document.addEventListener("dragstart", function (ev) {
  const row = instanceRowFor(ev.target);
  if (!row) return;
  dragAlias = row.dataset.alias;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", dragAlias); } catch {}
  row.classList.add("dragging");
});
document.addEventListener("dragend", function (ev) {
  const row = instanceRowFor(ev.target);
  if (row) row.classList.remove("dragging");
  document.querySelectorAll(".instance-row.drop-above, .instance-row.drop-below").forEach(r => r.classList.remove("drop-above", "drop-below"));
  if (!dragAlias) return;
  dragAlias = null;
  persistInstanceOrder();
});
document.addEventListener("dragover", function (ev) {
  if (!dragAlias) return;
  const sum = ev.target.closest("summary.instance-summary");
  const row = instanceRowFor(sum);
  if (!sum || !row || row.dataset.alias === dragAlias) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  const panel = $("instances-panel");
  const dragged = panel.querySelector(`details[data-alias="${CSS.escape(dragAlias)}"]`);
  if (!dragged) return;
  const before = ev.clientY < sum.getBoundingClientRect().top + sum.getBoundingClientRect().height / 2;
  document.querySelectorAll(".instance-row.drop-above, .instance-row.drop-below").forEach(r => r.classList.remove("drop-above", "drop-below"));
  row.classList.add(before ? "drop-above" : "drop-below");
  if (before) panel.insertBefore(dragged, row);
  else panel.insertBefore(dragged, row.nextElementSibling);
});
document.addEventListener("drop", function (ev) {
  if (dragAlias) ev.preventDefault();
});
// persistInstanceOrder saves the visible list order as instance priorities.
async function persistInstanceOrder() {
  const panel = $("instances-panel");
  if (!panel) return;
  const aliases = [...panel.querySelectorAll("details.instance-row")].map(d => d.dataset.alias);
  try {
    await api("/api/instances/order", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ aliases }) });
    await loadProviders();
  } catch (e) { alert(e.message); }
}
// fetchModels loads GET /api/instances/{alias}/models into fetchedModels /
// fetchedMeta, falling back to the instance's configured models when the
// fetch is unavailable. It never throws so callers can rely on a list.
async function fetchModels(alias, refresh) {
  let data;
  try {
    data = await api("/api/instances/" + encodeURIComponent(alias) + "/models" + (refresh ? "?refresh=1" : ""));
  } catch (e) {
    const inst = instances.find(x => x.alias === alias);
    data = { models: inst ? inst.models : [], source: "config", error: e.message };
  }
  fetchedModels[alias] = data.models || [];
  fetchedMeta[alias] = { source: data.source || "config", fetched_at: data.fetched_at || "", error: data.error || "" };
}
// modelOptions builds the <option> set for an instance's model datalist. Model
// ids come from the provider (or config fallback) and are provider-controlled,
// so every value is esc()'d.
function modelOptions(alias) {
  return (fetchedModels[alias] || []).map(m => `<option value="${esc(m)}">`).join("");
}
// humanTime renders an ISO timestamp as a short relative time ("just now",
// "3 min ago", "5 h ago") or a plain date for older values; unparseable input
// passes through unchanged.
function humanTime(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  const diff = Date.now() - d.getTime();
  if (diff < 60_000) return "just now";
  if (diff < 3600_000) return Math.round(diff / 60_000) + " min ago";
  if (diff < 86_400_000) return Math.round(diff / 3600_000) + " h ago";
  return d.toLocaleDateString();
}
// aliasesStatus is the muted source/freshness line shown next to an instance.
function aliasesStatus(alias) {
  const meta = fetchedMeta[alias];
  if (!meta) return "";
  const src = meta.source === "provider" ? "fetched from provider" : "configured models";
  let html = esc(src);
  if (meta.fetched_at) html += " · " + esc(humanTime(meta.fetched_at));
  if (meta.error) html += ` <span class="badge warn">${esc(meta.error)}</span>`;
  return html;
}
// reasoningOptionsFor returns the reasoning effort values the instance's
// template advertises for a row's model (served by GET /api/templates as
// model_reasoning_options), or null when unknown so callers fall back to the
// generic list. Mirrors config validation: advertised models gate, others use
// the extended default vocabulary.
const GENERIC_REASONING = ["low", "medium", "high", "max"];
function reasoningOptionsFor(inst, model) {
  const t = (templates || []).find(x => x.name === (inst && inst.template));
  const opts = t && t.model_reasoning_options && t.model_reasoning_options[model];
  return Array.isArray(opts) && opts.length ? opts : null;
}
// aliasRowHtml renders one editable row. Keys/values come from gateway.toml
// (user-controlled) and model ids from the provider, so all are esc()'d; the
// model input doubles as free-typed custom model entry via the datalist.
function aliasRowHtml(alias, key, val, reasoning, i, opts) {
  const r = reasoning || "";
  const levels = ((opts && opts.length ? opts : GENERIC_REASONING).slice());
  if (r && !levels.includes(r)) levels.push(r); // keep a saved value selectable
  const levelOptions = levels.map(l =>
    `<option value="${esc(l)}" ${r === l ? "selected" : ""}>${esc(l.charAt(0).toUpperCase() + l.slice(1))}</option>`
  ).join("");
  return `<tr>
    <td><input class="aliases-key" value="${esc(key)}" placeholder="e.g. small"></td>
    <td><input class="aliases-model" list="dl-models-${esc(alias)}" value="${esc(val)}" placeholder="choose a model or type one"></td>
    <td>
      <select class="aliases-reasoning">
        <option value="" ${r === "" ? "selected" : ""}>Default</option>
        <option value="none" ${r === "none" ? "selected" : ""}>None</option>
        ${levelOptions}
      </select>
    </td>
    <td>
      <button class="ghost btn-sm" data-action="aliases-remove" data-alias="${esc(alias)}" data-row="${i}">Remove</button>
    </td>
  </tr>`;
}
// emptyAliasesRowHtml is the dashed placeholder row shown while a provider has
// no alias rows; its embedded button stages a first row in place.
function emptyAliasesRowHtml(alias) {
  return `<tr class="no-aliases aliases-empty"><td colspan="4">No aliases configured yet — map a model to a name.
    <button class="outline btn-sm" data-action="aliases-add" data-alias="${esc(alias)}">+ Add your first alias</button></td></tr>`;
}
function renderAliasRows(inst) {
  const rows = Object.entries(inst.model_aliases || {});
  if (!rows.length) return emptyAliasesRowHtml(inst.alias);
  return rows.map(([key, val], i) => {
    const reasoning = (inst.model_reasoning && inst.model_reasoning[key]) || "";
    return aliasRowHtml(inst.alias, key, val, reasoning, i, reasoningOptionsFor(inst, val));
  }).join("");
}
function addAliasRow(alias) {
  const tbody = $("aliases-body-" + alias);
  if (!tbody) return;
  const placeholder = tbody.querySelector("tr.no-aliases");
  if (placeholder) placeholder.remove();
  tbody.insertAdjacentHTML("beforeend", aliasRowHtml(alias, "", "", "", tbody.children.length));
}
// removeAliasRow drops the row client-side (unsaved until Save). It uses the
// clicked row's DOM position rather than the data-row index so it stays
// correct after rows are removed and reordered without a re-render. Removing
// the last row restores the dashed empty-state placeholder.
function removeAliasRow(el) {
  const row = el.closest("tr");
  if (row) row.remove();
  const tbody = $("aliases-body-" + el.dataset.alias);
  if (tbody && !tbody.querySelector("tr:not(.no-aliases)")) {
    tbody.innerHTML = emptyAliasesRowHtml(el.dataset.alias);
  }
}
async function refreshModels(alias) {
  try {
    await fetchModels(alias, true);
    const dl = $("dl-models-" + alias);
    if (dl) dl.innerHTML = modelOptions(alias);
    const status = $("models-status-" + alias);
    if (status) status.innerHTML = aliasesStatus(alias);
  } catch (e) { alert(e.message); }
}
// saveInstance is the single Save for a provider entry: it PATCHes the staged
// model_aliases / model_reasoning maps (replace semantics; rows with an empty
// alias name are dropped) together with the staged plugin list when it
// differs from what the instance already runs. Invalid names/empty models are
// rejected server-side and surfaced via the existing alert path.
async function saveInstance(alias) {
  const map = {};
  const reasoningMap = {};
  const tbody = $("aliases-body-" + alias);
  if (tbody) tbody.querySelectorAll("tr").forEach(tr => {
    const key = tr.querySelector(".aliases-key");
    const model = tr.querySelector(".aliases-model");
    const reasoning = tr.querySelector(".aliases-reasoning");
    if (!key || !model) return;
    const name = key.value.trim();
    if (name) {
      map[name] = model.value.trim();
      if (reasoning && reasoning.value) {
        reasoningMap[name] = reasoning.value;
      }
    }
  });
  const body = { model_aliases: map, model_reasoning: reasoningMap };
  const inst = instances.find(x => x.alias === alias);
  if (inst) {
    const plugins = pluginsPatchValue(inst, stagedPluginNames(alias));
    if (plugins !== undefined) body.plugins = plugins;
  }
  try {
    await api("/api/instances/" + encodeURIComponent(alias), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    await loadProviders();
  } catch (e) { alert(e.message); }
}
// cancelInstanceEdits discards staged alias/plugin edits by rebuilding the
// provider's expanded card from in-memory instance state — nothing was
// persisted, so no server round-trip is needed. (Replacing the <details>
// fires a toggle with open=false, which the toggle listener ignores because
// the old node is detached by then.)
function cancelInstanceEdits(alias) {
  const row = document.querySelector(`details.instance-row[data-alias="${CSS.escape(alias)}"]`);
  const inst = instances.find(x => x.alias === alias);
  if (!row || !inst) return;
  const tpl = document.createElement("template");
  tpl.innerHTML = instanceBlockHtml(inst).trim();
  row.replaceWith(tpl.content.firstElementChild);
}

async function saveSettings() {
  const n = parseInt($("set-retention").value, 10);

/* ----- plugins ----- */
// pluginEnabled reads a plugin's global-default state from the cached
// /api/plugins payload (listed on either side of the global chain).
function pluginEnabled(name) {
  return (pluginsData.request_plugins || []).includes(name) || (pluginsData.response_plugins || []).includes(name);
}
// pluginScope explains where a plugin actually runs: the global default plus
// any per-instance plugins lists (which replace the global chain entirely).
function pluginScope(name, enabled) {
  const insts = pluginsData.instances || [];
  const fmt = (list) => list.map(x => esc(x.alias) + (x.disabled ? " (disabled)" : "")).join(", ");
  if (!insts.length) return enabled ? "Global default; no instances configured yet." : "Off everywhere.";
  const own = insts.filter(i => i.override);
  const on = insts.filter(i => (i.plugins || []).includes(name));
  if (!enabled) {
    return on.length ? `Not a global default — active on: ${fmt(on)}.` : "Off everywhere.";
  }
  if (!own.length) return "Active on every instance (global default).";
  const inherit = on.filter(i => !i.override);
  const ownOn = on.filter(i => i.override);
  const ownOff = own.filter(i => !(i.plugins || []).includes(name));
  const bits = [];
  if (inherit.length) bits.push(`inherited by ${fmt(inherit)}`);
  if (ownOn.length) bits.push(`explicitly listed on ${fmt(ownOn)}`);
  if (ownOff.length) bits.push(`NOT applied to ${fmt(ownOff)} — their own plugins list replaces the global chain`);
  return "Global default — " + bits.join("; ") + ".";
}
// pluginCard renders one plugin: what it does, kind/source badges, the
// enable/disable toggle, where it is active, and (for configurable plugins)
// a settings fold backed by [plugins.<name>] in gateway.toml.
function pluginCard(info) {
  const enabled = pluginEnabled(info.name);
  const cfg = (pluginsData.plugin_config || {})[info.name] || null;
  const kindBadge = `<span class="badge ok" title="Transform plugin — rewrites request/response payloads">transform</span>`;
  let cfgLine = "";
  if (info.configurable) {
    cfgLine = cfg
      ? `<div class="plugin-scope">Custom settings active: <code>${esc(JSON.stringify(cfg))}</code></div>`
      : `<div class="plugin-scope">Using built-in default settings.</div>`;
  }
  return `<div class="plugin-card">
    <div class="plugin-head">
      <div class="plugin-info">
        <div><b>${esc(info.name)}</b> ${kindBadge} <span class="badge disabled">${esc(info.source)}</span> ${enabled ? `<span class="badge ok">enabled</span>` : `<span class="badge disabled">off</span>`}</div>
        <div class="plugin-desc">${esc(info.description)}</div>
        <div class="plugin-scope">${pluginScope(info.name, enabled)}</div>
        ${cfgLine}
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;align-items:center">
        <button class="${enabled ? "ghost" : ""}" data-action="plugin-toggle" data-name="${esc(info.name)}">${enabled ? "Disable" : "Enable"}</button>
      </div>
    </div>
    ${info.configurable ? pluginConfigForm(info, cfg) : ""}
  </div>`;
}
// pluginConfigForm renders one textarea per documented config field of the
// plugin's [plugins.<name>] table. Empty = fall back to that field's default
// (or no effect for fields without defaults); saving an entirely empty form
// clears the table from gateway.toml.
function pluginConfigForm(info, cfg) {
  cfg = cfg || {};
  const fields = (info.config_fields || []).map(f => {
    const val = Array.isArray(cfg[f.name]) ? cfg[f.name].join("\n") : "";
    const rows = Math.max(3, Math.min(8, (f.defaults || []).length + 1));
    const ph = (f.defaults && f.defaults.length)
      ? "Default (used when empty):\n" + f.defaults.join("\n")
      : "Empty = no entries";
    return `<label style="flex:1;min-width:280px"><code>${esc(f.name)}</code>
      <textarea id="pc-${esc(f.name)}-${esc(info.name)}" rows="${rows}" placeholder="${esc(ph)}">${esc(val)}</textarea>
    </label>`;
  }).join("");
  const fieldDocs = (info.config_fields || []).map(f =>
    `<div style="margin-bottom:6px"><code>${esc(f.name)}</code> — ${esc(f.description)}${f.defaults && f.defaults.length ? ` Defaults: <code>${esc(f.defaults.join(" · "))}</code>` : ""}</div>`
  ).join("");
  return `<details class="plugin-config">
    <summary class="clickable">Plugin settings — open to edit what this plugin does</summary>
    <div style="margin:10px 0;line-height:1.55;font-size:12px;color:var(--text2)">${fieldDocs}</div>
    <div class="row" style="align-items:start">${fields}</div>
    <div class="row" style="margin-top:10px">
      <button data-action="plugin-save-config" data-name="${esc(info.name)}">Save settings</button>
      <span style="font-size:12px;color:var(--text2)">One entry per line · empty a field to fall back to its default · stored in gateway.toml under <code>[plugins.${esc(info.name)}]</code></span>
    </div>
  </details>`;
}
function renderPlugins() {
  const infos = pluginsData.plugins || [];
  return `<div class="panel" id="plugins-panel">
    <h2>Plugins</h2>
    <div style="font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:12px">
      Plugins are small transforms the gateway applies to requests before they reach the provider, and to responses after the provider stream is reassembled.
      The toggle on each plugin is the <b>global default</b>: every instance set to "inherit" follows it. To turn plugins on or off for one provider only,
      expand that provider in the <b>Providers</b> view and edit its <b>Plugins</b> row — an explicit list there replaces the global chain for that instance.
      The store always keeps both the original and the
      filtered payloads plus which plugins ran (<code>plugins_applied</code>), so every effect is auditable in Traces.
    </div>
    ${infos.map(pluginCard).join("")}
  </div>`;
}

/* ----- custom plugins: how to write and add your own ----- */
function renderCustomPluginInstructions() {
  return `<div class="panel instructions">
    <h2>Creating custom plugins</h2>
    <div style="line-height:1.6;font-size:12px;color:var(--text2)">
      <p>Plugins are compiled into the gateway binary — external loading (WASM / separate binaries) is planned for v2 — so a custom plugin is a small Go file inside this repo:</p>
      <ol>
        <li><b>Implement the seam.</b> Create <code>internal/plugins/mine.go</code> in package <code>plugins</code>:
<pre>type mine struct{}

func (mine) Name() string { return "mine" }

// Runs before the request is forwarded to the provider.
// Mutate req.Body (json.RawMessage) in place.
func (mine) FilterRequest(ctx context.Context, req *Request) error {
    return nil
}

// Runs on the response after streaming is reassembled.
func (mine) FilterResponse(ctx context.Context, resp *Response) error {
    return nil
}</pre></li>
        <li><b>Register a factory</b> in an <code>init()</code> in the same file. It receives the plugin's optional <code>[plugins.mine]</code> TOML table as <code>o.Config</code>:
<pre>func init() {
    Register("mine", func(o Options) (Plugin, error) {
        return mine{}, nil
    })
}</pre></li>
        <li><b>Optional: settings + docs.</b> Decode <code>o.Config</code> into your own struct (validate there — invalid values should fail the build, not the request), then call <code>registerInfo(Info{...})</code> with a description and <code>ConfigFields</code> so your plugin shows up in the list above with its own settings form.</li>
        <li><b>Build &amp; restart.</b> <code>go build ./cmd/gateway</code>. Unknown plugin names in gateway.toml fail config validation at startup, so a typo can never slip through silently.</li>
        <li><b>Enable it</b> with the toggle above (global default) or per instance with <code>plugins = ["mine"]</code>.</li>
      </ol>
      <p>Ordering: request plugins run in config order before forwarding; response plugins run in config order on the fully reassembled response (streaming is buffered while any response plugin is active). Every capture keeps the original payload, the filtered payload, and <code>plugins_applied</code>.</p>
    </div>
  </div>`;
}

// togglePlugin flips a plugin's global-default state: enabled adds it to both
// the request and response sides of settings, disabled removes it from both
// (mirroring how a per-instance plugins list applies to both sides).
async function togglePlugin(name) {
  try {
    await api("/api/plugins/" + encodeURIComponent(name), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: !pluginEnabled(name) }) });
    await loadSettings();
  } catch (e) { alert(e.message); }
}
// savePluginConfig writes the plugin's settings form as its [plugins.<name>]
// table: one entry per textarea line, empty fields fall back to their defaults
// (an entirely empty form clears the table). Invalid values (e.g. a broken
// regex) are rejected server-side before anything is persisted.
async function savePluginConfig(name) {
  const info = (pluginsData.plugins || []).find(p => p.name === name);
  if (!info) return;
  const cfg = {};
  (info.config_fields || []).forEach(f => {
    const el = document.getElementById("pc-" + f.name + "-" + name);
    if (!el) return;
    const lines = el.value.split("\n").map(x => x.trim()).filter(Boolean);
    if (lines.length) cfg[f.name] = lines;
  });
  try {
    await api("/api/plugins/" + encodeURIComponent(name), { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ config: cfg }) });
    await loadSettings();
  } catch (e) { alert(e.message); }
}

/* ---------- Traces ---------- */
function renderFilters() {
  $("view-traces").innerHTML = `
    <div class="panel">
      <h2>Traces</h2>
      <div class="row">
        <label>Alias<input id="f-alias"></label>
        <label>Model<input id="f-model"></label>
        <label>Status<select id="f-status"><option value="">any</option><option value="ok">ok</option><option value="error">error</option></select></label>
        <label>Since<input id="f-since" type="date"></label>

async function loadSessions() {
  const params = new URLSearchParams();
  if ($("f-alias").value) params.set("alias", $("f-alias").value);
  if ($("f-model").value) params.set("model", $("f-model").value);
  if ($("f-status").value) params.set("status", $("f-status").value);
  if ($("f-since").value) params.set("since", $("f-since").value + "T00:00:00Z");
  if ($("f-until").value) params.set("until", $("f-until").value + "T23:59:59Z");
  if ($("f-q").value) params.set("q", $("f-q").value);
  const data = await api("/api/sessions?" + params.toString());
  // Leaving the detail view: drop the deep-link hash so a reload lands on the
  // list instead of re-opening the previous session (replaceState does not
  // navigate or fire hashchange).
  if (hashSessionId() != null) history.replaceState(null, "", location.pathname + location.search);
  const list = $("session-list");
  if (!data.sessions.length) { list.innerHTML = `<span class="muted">No sessions.</span>`; return; }
  list.innerHTML = `<table><thead><tr><th>Session</th><th>Created</th><th>Alias / Model</th><th>Requests</th><th>Tools</th><th>Status</th></tr></thead><tbody>
    ${data.sessions.map(s => `<tr>
      <td><span class="clickable" data-action="open-session" data-id="${esc(s.id)}">${esc(s.id.slice(0, 8))}</span><a class="newtab" href="#session=${encodeURIComponent(s.id)}" target="_blank" rel="noopener" title="Open session in a new tab">new tab</a></td>
      <td class="muted">${esc(s.created_at)}</td>
      <td>${esc(s.first_alias)} / ${esc(s.first_model)}</td>
      <td>${s.request_count}</td><td>${s.tool_call_count}</td>
      <td>${s.failure_count > 0 ? `<span class="badge err">${s.failure_count} failures</span>` : `<span class="badge ok">ok</span>`}${s.expired ? ` <span class="badge warn">expired</span>` : ""}</td>
    </tr>`).join("")}
  </tbody></table>`;
  $("session-detail").classList.add("hidden");
}
// hashSessionId parses the deep-link hash "#session=<id>" (set by openSession
// and by the per-row "new tab" anchors) into the session id, or null. A bare
// "#session=" hash has no id and is treated as null so callers never attempt
// openSession("") (which would 404). Malformed escapes also return null.
function hashSessionId() {
  const h = location.hash;
  if (!h || h.indexOf("session=") !== 1) return null;
  let id;
  try { id = decodeURIComponent(h.slice(9)); } catch { return null; }
  return id || null;
}
// ignoreNextHash guards the hashchange listener against the hash write made by
// openSession itself (that session is already being rendered).
let ignoreNextHash = false;
// Live deep-link navigation: hashchange fires on back/forward, manual URL
// edits, and same-tab clicks on the "#session=" anchors.
window.addEventListener("hashchange", () => {
  if (ignoreNextHash) { ignoreNextHash = false; return; }
  const id = hashSessionId();
  if (id == null) return;
  switchView("traces");
  openSession(id);
});
async function openSession(id) {
  const detail = $("session-detail");
  detail.classList.remove("hidden");
  detail.innerHTML = `<div class="row" style="margin-bottom:10px"><h2 style="margin:0">Session ${esc(id)}</h2>
    <button class="ghost" data-action="export-session" data-id="${esc(id)}">Export JSONL</button>
    <button class="ghost" data-action="back">Back</button></div><div class="muted">Loading…</div>`;
  // Keep the deep-link hash in sync. The hashchange this triggers is ignored
  // via ignoreNextHash because the session is already being opened.
  const target = "#session=" + encodeURIComponent(id);
  if (location.hash !== target) { ignoreNextHash = true; location.hash = target; }
  const s = await api("/api/sessions/" + encodeURIComponent(id));
  const callsByReq = {};
  (s.tool_calls || []).forEach(c => { (callsByReq[c.request_id] = callsByReq[c.request_id] || []).push(c); });
  const toolCount = (s.tool_calls || []).length;
  let html = `<div class="muted">${esc(s.created_at)} · alias ${esc(s.first_alias)} · model ${esc(s.first_model)} · ${s.request_count} requests · ${toolCount} tool calls</div>`;
  // Retention keeps only the usage metadata for expired sessions; say so
  // instead of rendering an apparently empty conversation.
  if (s.expired) {
    html += `<div class="badge warn" style="margin:10px 0">payloads expired — conversation content was removed by retention; usage statistics are retained</div>`;
  }
  // Pre-pass: collect the FULL tool results from every request's history
  // (role:"tool" messages, keyed by tool_call_id). The result for request N's
  // tool call arrives in request N+1's payload, so it must be gathered before
  // the per-window render loop below.
  const toolResults = {};
  (s.requests || []).forEach(r => {
    const req = safeParse(r.request_json);
    const msgs = req && Array.isArray(req.messages) ? req.messages : [];
    msgs.forEach(m => {
      if (m && m.role === "tool" && m.tool_call_id != null) {
        toolResults[m.tool_call_id] = contentText(m.content);
      }
    });
  });
  // Render the session as one continuous conversation: each request window
  // shows only the messages that are NEW in that turn (the common-prefix tail,
  // mirroring the Go replay), so nothing is re-rendered in later windows.
  let prevMsgs = [];
  (s.requests || []).forEach(r => {
    const req = safeParse(r.request_json);
    const msgs = req && Array.isArray(req.messages) ? req.messages : null;
    let newMsgs = msgs;
    if (msgs != null) {
      newMsgs = messagesTail(prevMsgs, msgs);
      prevMsgs = msgs;
    }
    html += chatWindowHtml(r, callsByReq[r.id] || [], newMsgs, toolResults);
  });
  detail.innerHTML = detail.innerHTML.replace('<div class="muted">Loading…</div>', html);
  // Move focus to the just-rendered chat.
  detail.scrollIntoView({ behavior: "smooth", block: "start" });
}
// contentText flattens a message.content value into displayable text: strings
// pass through, array parts (OpenAI multimodal format) contribute their text
// fields and non-text parts become [image]/[part] placeholders. The array is
// never JSON.stringified into the bubble.
function contentText(content) {
  if (content == null) return "";
  if (typeof content === "string") return content;
  if (Array.isArray(content)) {
    return content.map(p => {
      if (p == null) return "";
      if (typeof p === "string") return p;
      if (p.type === "text" && p.text != null) return String(p.text);
      if (p.type === "image_url") return "[image]";
      return "[" + String(p.type || "part") + "]";
    }).join("");
  }
  return String(content);
}
// msgText extracts displayable text from a message via contentText.
function msgText(m) {
  return contentText(m && m.content);
}
// prettyArgs pretty-prints tool-call arguments, which are a JSON string (or
// already an object via json.RawMessage); malformed values fall back raw.
function prettyArgs(args) {
  if (args == null || args === "") return "";
  if (typeof args !== "string") {
    try { return JSON.stringify(args, null, 2); } catch { return String(args); }
  }
  try { return JSON.stringify(JSON.parse(args), null, 2); } catch { return args; }
}
// canonicalJson returns a whitespace-insensitive encoding of a message content
// value for prefix comparison (mirrors the Go replay's compactRaw).
function canonicalJson(v) {
  try {
    const s = JSON.stringify(v);
    return s === undefined ? "\u0000" : s;
  } catch { return String(v); }
}
// sameMessage mirrors the Go replay's sameOpenAIMessage: two messages are the
// same when role, tool_call_id and content match.
function sameMessage(a, b) {
  return !!a && !!b &&
    (a.role || "") === (b.role || "") &&
    (a.tool_call_id || "") === (b.tool_call_id || "") &&
    canonicalJson(a.content) === canonicalJson(b.content);
}
// messagesTail mirrors the Go replay's newMessagesTail: returns the tail of cur
// after the longest common prefix with prev. OpenAI clients resend the full
// history with every request, so the tail is what is actually new for this
// turn and only it gets rendered — no message is repeated across windows.
function messagesTail(prev, cur) {
  if (!prev || !prev.length || !cur) return cur || [];
  let n = 0;
  while (n < prev.length && n < cur.length && sameMessage(prev[n], cur[n])) n++;
  return cur.slice(n);
}
// Chat bubble role classes that exist in CSS; unknown provider roles render
// with the default assistant (left) alignment.
const CHAT_ROLES = new Set(["user", "assistant", "system", "tool"]);
// toolCallHtml renders one assistant tool call as a styled block: name, pretty
// arguments, and the tool result (the FULL role:"tool" result matched by the
// provider tool_call id when available, falling back to the row's truncated
// result_snippet), plus — when the matching tool_calls row is available — the
// verdict badge. This is the only place a tool call renders, merged into the
// assistant reply, so each call appears exactly once.
function toolCallHtml(tc, row, toolResults) {
  const fn = (tc && tc.function) || {};
  const name = tc ? (fn.name || "tool_call") : (row ? row.tool_name : "tool_call");
  const args = prettyArgs((tc && fn.arguments) || (row && row.arguments_json));
  const result = (tc && tc.id != null && toolResults && toolResults[tc.id] != null)
    ? toolResults[tc.id]
    : (row && row.result_snippet);
  let html = `<div class="tool-call"><span class="chat-role">tool call</span><b>${esc(name || "tool_call")}</b>`;
  if (row) {
    if (row.verdict) html += ` <span class="verdict ${esc(row.verdict)}">${esc(row.verdict)}</span>`;
    if (row.result_is_error) html += ` <span class="badge err">error</span>`;
  }
  if (args) html += `<pre>${esc(args)}</pre>`;
  if (result) html += `<div class="chat-content">${esc(result)}</div>`;
  return html + `</div>`;
}
// requestMessageHtml renders one request message as a chat bubble with a role
// label. Assistant tool_calls in replayed history are intentionally NOT
// rendered as blocks here: the tool call itself renders exactly once, in the
// assistant reply of the turn that produced it (see responseMessageHtml), so
// it never duplicates across windows. Roles and content come from the request
// payload (provider-controlled), so every interpolated value is esc()'d.
function requestMessageHtml(m) {
  const role = (m && m.role) || "user";
  let inner = `<span class="chat-role">${esc(role)}</span>`;
  const text = msgText(m);
  if (text) inner += `<div class="chat-content">${esc(text)}</div>`;
  else if (role === "assistant") inner += `<div class="chat-content muted">(tool calls)</div>`;
  return `<div class="msg ${CHAT_ROLES.has(role) ? esc(role) : "assistant"}">${inner}</div>`;
}
// responseMessageHtml renders the assistant reply from the reassembled
// OpenAI-style response_json, merged with the request's tool_calls rows: each
// tool call appears exactly once, as a block carrying name + pretty arguments
// + FULL result (from the role:"tool" message matched by tool_call_id, via
// toolResults) + verdict (matched to the row by flattened index, mirroring
// the Go replay's assistantReplayMessage). When the response body is missing
// but tool rows were captured, the rows are still rendered so the turn is not
// lost.
function responseMessageHtml(resp, reqCalls, toolResults) {
  const rows = reqCalls || [];
  const calls = [];
  let content = "";
  let hasMsg = false;
  let callIdx = 0;
  ((resp && resp.choices) || []).forEach(ch => {
    const m = ch && ch.message;
    if (!m) return;
    hasMsg = true;
    if (!content) content = msgText(m);
    (Array.isArray(m.tool_calls) ? m.tool_calls : []).forEach(tc => {
      calls.push({ tc: tc, row: rows[callIdx] || null });
      callIdx++;
    });
  });
  if (!calls.length && rows.length) {
    rows.forEach(row => calls.push({ tc: null, row: row }));
  }
  if (!hasMsg && !calls.length) return "";
  let inner = `<span class="chat-role">assistant</span>`;
  if (content) inner += `<div class="chat-content">${esc(content)}</div>`;
  else if (!calls.length) inner += `<div class="chat-content muted">(tool calls)</div>`;
  calls.forEach(c => { inner += toolCallHtml(c.tc, c.row, toolResults); });
  return `<div class="msg assistant">${inner}</div>`;
}
// usageSuffix formats the token-usage tail of the request metadata line. usage
// is provider-controlled, so the returned text is esc()'d before interpolation.
function usageSuffix(u) {
  if (u == null) return "";
  const o = toObj(u);
  if (o != null && typeof o === "object") {
    const bits = [];
    if (o.prompt_tokens != null) bits.push(o.prompt_tokens + " in");
    if (o.completion_tokens != null) bits.push(o.completion_tokens + " out");
    if (o.total_tokens != null) bits.push(o.total_tokens + " total");
    return " · usage " + (bits.length ? bits.join(", ") : JSON.stringify(o));
  }
  return " · usage " + String(u);
}
// chatWindowHtml renders one request as a chat window: only the NEW request
// messages for this turn (newMsgs — the common-prefix tail computed by
// openSession, mirroring the Go replay's newMessagesTail), the assistant reply
// merged with its tool calls (each rendered exactly once, with its FULL result
// from toolResults), and an expandable details section with the original
// request/response JSON (never the filtered/redacted payloads) plus metadata.
function chatWindowHtml(r, reqCalls, newMsgs, toolResults) {
  const resp = safeParse(r.response_json);
  let html = `<div class="chat-window">`;
  html += `<h3 style="margin:0 0 4px">Request #${r.seq} <span class="muted">${esc(r.alias)}/${esc(r.model)} · HTTP ${esc(r.status_code)} · ${esc(r.duration_ms)} ms${r.finish_reason ? " · finish " + esc(r.finish_reason) : ""}${esc(usageSuffix(r.usage))}</span>${r.truncated ? ' <span class="badge warn">truncated</span>' : ""}</h3>`;
  html += `<div class="chat">`;
  (newMsgs || []).forEach(m => { html += requestMessageHtml(m); });
  html += responseMessageHtml(resp, reqCalls, toolResults);
  if (r.error) {
    let errMsg = r.error;
    if (typeof r.error === "object") errMsg = r.error.message || r.error.code || JSON.stringify(r.error);
    html += `<div class="msg tool"><span class="chat-role">tool</span><div class="tool-result"><b>request error</b><div class="chat-content">${esc(errMsg)}</div></div></div>`;
  }
  html += `</div>`;
  html += `<details style="margin-top:10px"><summary class="clickable muted">full request/response details</summary>
    <pre style="margin-top:8px">REQUEST\n${esc(jsonish(r.request_json))}</pre>
    <pre>RESPONSE\n${esc(jsonish(r.response_json))}</pre>
  </details>`;
  return html + `</div>`;
}
// safeParse mirrors the old name but delegates to toObj: it returns the parsed
// object whether the field is already an object or a JSON string.
function safeParse(s) {
  return toObj(s);
}

/* ---------- Usage ---------- */
// The Usage view aggregates estimated cost and token usage over the captured
